:root{--bg:#efe7ff;--panel:rgba(255,255,255,.8);--strong:#fff;--text:#1f1536;--muted:#665a85;--line:rgba(76,40,140,.16);--accent:#7c3aed;--accent2:#c026d3;--shadow:0 20px 60px rgba(70,40,130,.16);--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1036;--panel:rgba(48,31,90,.78);--strong:#2d1c54;--text:#f7f3ff;--muted:#c0b5e3;--line:rgba(255,255,255,.15);--accent:#c4b5fd;--accent2:#f0abfc;--shadow:0 20px 60px rgba(0,0,0,.35);--on:#101321;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1036;--panel:rgba(48,31,90,.78);--strong:#2d1c54;--text:#f7f3ff;--muted:#c0b5e3;--line:rgba(255,255,255,.15);--accent:#c4b5fd;--accent2:#f0abfc;--shadow:0 20px 60px rgba(0,0,0,.35);--on:#101321;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .25s,color .25s}
body::before,body::after{content:"";position:fixed;z-index:-1;width:34rem;height:34rem;border-radius:50%;filter:blur(90px);opacity:.2;pointer-events:none}
body::before{background:#8b5cf6;top:-15rem;left:-12rem}body::after{background:#d946ef;right:-15rem;bottom:-18rem}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
.wrap{width:min(100% - 28px,1040px);margin:0 auto;padding:18px 0 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:6px 0}
.brand{font-weight:800;letter-spacing:-.04em}.brand span{color:var(--accent)}
.nav{display:flex;gap:6px;align-items:center}
.nav a,.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 13px;font-size:.85rem;cursor:pointer;backdrop-filter:blur(12px);transition:transform .2s,border-color .2s}
.nav a:hover,.pill:hover{transform:translateY(-2px);border-color:var(--accent)}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,50px);background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border:1px solid var(--line);border-radius:50%;right:-90px;top:-95px;box-shadow:0 0 0 25px rgba(99,102,241,.05),0 0 0 55px rgba(99,102,241,.035);pointer-events:none}
.row{display:flex;align-items:center;gap:22px;position:relative;z-index:1}
.avatar{width:116px;height:116px;flex:0 0 116px;border-radius:32px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:2.4rem;font-weight:800;color:var(--on);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.avatar img{width:100%;height:100%;object-fit:cover}
.eyebrow{color:var(--accent);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.16em;margin:0 0 8px}
h1{margin:0;font-size:clamp(1.9rem,6vw,3.5rem);line-height:1.04;letter-spacing:-.05em}
.role{margin:10px 0 0;color:var(--muted);line-height:1.6}
.bio{max-width:680px;margin:24px 0 0;color:var(--muted);line-height:1.8;position:relative;z-index:1}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:14px;padding:11px 17px;font-weight:700;border:1px solid var(--line);background:var(--strong);cursor:pointer;transition:transform .2s,filter .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05);border-color:var(--accent)}
.btn.primary{color:var(--on);border:0;background:linear-gradient(120deg,var(--accent),var(--accent2))}
section.s{margin-top:30px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 2px 14px;flex-wrap:wrap}
h2{font-size:1.15rem;letter-spacing:-.02em;margin:0}.head p{margin:0;color:var(--muted);font-size:.86rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{display:flex;align-items:center;gap:14px;min-width:0;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(14px);transition:transform .2s,border-color .2s,background .2s}
a.card:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--strong)}
.ico{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(6,182,212,.14));font-size:1.15rem;font-weight:800}
.copy{min-width:0;flex:1}.copy strong{display:block;font-size:.95rem}
.copy span{display:block;color:var(--muted);font-size:.82rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{color:var(--muted)}
.ico.brand{color:#fff;border-radius:14px}.ico svg{width:24px;height:24px;display:block}
.contacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.contacts .card{flex-wrap:wrap}.contacts .copy span{white-space:normal;overflow-wrap:anywhere}
.mini{border:1px solid var(--line);background:var(--strong);border-radius:999px;padding:7px 12px;font-size:.8rem;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.btns{display:flex;gap:6px;width:100%;padding-left:60px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on);border-color:transparent;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.proj{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;background:var(--panel);overflow:hidden;transition:transform .2s,border-color .2s}
.proj:hover{transform:translateY(-3px);border-color:var(--accent)}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;font-size:2rem;background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(6,182,212,.16));overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.pbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pbody h3{margin:0;font-size:1rem}.pbody p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.6}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.tags span{font-size:.72rem;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.proj.soon{border-style:dashed;opacity:.8}.proj.soon:hover{transform:none}
.tl{display:grid;gap:12px}.tli{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:16px 18px}
.th{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tli h3{margin:0;font-size:1rem}.tli .org{color:var(--accent);font-size:.88rem;margin-top:3px}.tli .per{color:var(--muted);font-size:.82rem}
.tli ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:.9rem;line-height:1.7}
.skills{display:flex;flex-wrap:wrap;gap:8px}.skills span{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:.86rem}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 0 16px;padding-bottom:4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 18px;font-weight:700;font-size:.9rem;cursor:pointer;transition:border-color .2s,transform .2s}
.tab:hover{border-color:var(--accent);transform:translateY(-2px)}.tab.on{background:linear-gradient(120deg,var(--accent),var(--accent2));color:var(--on);border-color:transparent}
.tp[hidden]{display:none}
.sub{margin:24px 2px 12px;font-size:1.05rem;letter-spacing:-.02em}
.bot{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:76px;z-index:4;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(40,10,90,.35))}
.bot svg{display:block;width:100%;height:auto;overflow:visible}
#botHead{transform-origin:50px 68px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.led{animation:pulse 1.8s ease-in-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50px 120px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (min-width:860px){.bot{width:104px;right:22px;bottom:20px}}
@media (prefers-reduced-motion:reduce){.eye,.led,.bob{animation:none}}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:28px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--strong);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);transition:.25s;z-index:9}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:860px){.grid,.pgrid,.contacts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:580px){
.wrap{width:min(100% - 22px,1040px)}.nav a{display:none}

.avatar{width:88px;height:88px;flex-basis:88px;border-radius:24px;font-size:1.9rem}
.grid,.pgrid,.contacts{grid-template-columns:1fr}
.actions .btn{flex:1 1 140px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>

const brandIcon = s => BRANDS[s.name]
  ? `<span class="ico brand" style="background:${BRANDS[s.name][0]}" aria-hidden="true">${BRANDS[s.name][1]}</span>`
  : `<span class="ico" aria-hidden="true">${esc(s.icon)}</span>`;

function render() {
  document.title = profile.name + ' — Digital Portfolio';
  $('#name').textContent = profile.name; $('#role').textContent = profile.role; $('#bio').textContent = profile.bio;
  $('#fname').textContent = profile.name; $('#year').textContent = new Date().getFullYear();
  const tel = 'tel:' + profile.phone.replace(/[^+\d]/g, '');
  $('#callBtn').href = tel; $('#mailBtn').href = 'mailto:' + profile.email;

  const av = $('#avatar');
  if (profile.photo.trim()) {
    const img = new Image(); img.alt = profile.name; img.src = profile.photo;
    img.onload = () => av.replaceChildren(img); av.textContent = profile.initials;
  } else av.textContent = profile.initials;

  $('#socials').innerHTML = profile.socials.filter(s => s.url.trim()).map(s => `
    <a class="card" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(s.name)}">
      ${brandIcon(s)}
      <span class="copy"><strong>${esc(s.name)}</strong><span>${esc(s.handle)}</span></span><span class="arrow" aria-hidden="true">↗</span></a>`).join('');

  const items = [
    { i: '☎', t: 'Cellphone', v: profile.phone, h: tel, l: 'Call' },
    { i: '✉', t: 'Email', v: profile.email, h: 'mailto:' + profile.email, l: 'Write' },
    { i: '⌖', t: 'Location', v: profile.location, h: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(profile.location), l: 'Map' }
  ];
  $('#contacts').innerHTML = items.map(c => `
    <div class="card"><span class="ico" aria-hidden="true">${c.i}</span>
      <span class="copy"><strong>${c.t}</strong><span>${esc(c.v)}</span></span>
      <div class="btns"><a class="mini" href="${esc(c.h)}" ${c.l === 'Map' ? 'target="_blank" rel="noopener noreferrer"' : ''}>${c.l}</a><button class="mini" type="button" data-copy="${esc(c.v)}">Copy</button></div></div>`).join('');
  renderPortfolio('All');
}

function renderPortfolio(cat) {
  const cats = ['All', ...new Set(portfolio.map(p => p.category).filter(Boolean))];
  $('#chips').innerHTML = portfolio.length > 1 && cats.length > 2
    ? cats.map(c => `<button class="chip ${c === cat ? 'on' : ''}" type="button" data-cat="${esc(c)}">${esc(c)}</button>`).join('') : '';
  if (!portfolio.length) {
    $('#projects').innerHTML = [['🛠️','Project coming soon'],['📊','Case study coming soon'],['🚀','Something new in progress']].map(([e,t]) => `
      <article class="proj soon"><div class="thumb">${e}</div><div class="pbody"><h3>${t}</h3><p>Check back soon — my work will appear here.</p></div></article>`).join('');
    return;
  }
  $('#projects').innerHTML = portfolio.filter(p => cat === 'All' || p.category === cat).map(p => {
    const media = p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">` : esc(p.emoji || '📁');
    const body = `<div class="thumb">${media}</div><div class="pbody"><h3>${esc(p.title)}</h3><p>${esc(p.desc || '')}</p>
      <div class="tags">${(p.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div></div>`;
    return p.url ? `<a class="proj" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${body}</a>` : `<article class="proj">${body}</article>`;
  }).join('');
}

$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) renderPortfolio(b.dataset.cat); });
$('#contacts').addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copyText(b.dataset.copy); });
$('#copyAll').addEventListener('click', () => copyText(`${profile.name}\n${profile.role}\nPhone: ${profile.phone}\nEmail: ${profile.email}\nLocation: ${profile.location}`));
$('#share').addEventListener('click', async () => {
  const d = { title: document.title, text: 'Connect with ' + profile.name, url: location.href };
  if (navigator.share) { try { await navigator.share(d); } catch (e) { if (e.name !== 'AbortError') toast('Sharing is not available here.'); } }
  else copyText(location.href);
});

const root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : mq.matches;
const syncTheme = () => { $('#theme').textContent = isDark() ? '☀️' : '🌙'; };
$('#theme').addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; syncTheme(); });
mq.addEventListener && mq.addEventListener('change', syncTheme);

/* Sections below stay hidden until they have entries. Template: { role, org, period, points: ["..."] } */
const experience = [
  { role: "OJT – Industrial Engineering Intern", org: "Hytec Power Inc. · Zabarte, Quezon City", period: "Feb. 2025 – Apr. 2025", points: ["Collaborated with engineers and technicians to complete projects within deadlines.", "Developed training modules and instructional materials, improving knowledge transfer and documentation quality.", "Managed product postings and updates on the company’s online platforms, keeping product information accurate and improving digital visibility."] },
  { role: "OJT – Industrial Engineering Intern", org: "11FTC Enterprises Inc. · Novaliches, Quezon City", period: "Sep. 2024 – Dec. 2024", points: ["Evaluated truck loading capacity and optimized operational workflows to improve resource utilization.", "Processed purchase orders and liquidation reports in Acumatica ERP with 100% accuracy and on-time processing.", "Conducted a Time and Motion Study to identify non-value-added activities, contributing to higher operational efficiency."] }
];
const education = [
  { role: "Bachelor of Science in Industrial Engineering", org: "Quezon City University · San Bartolome, Novaliches", period: "2026", points: [] }
];
const skills = ["Process Improvement & Optimization", "Operations Management", "Supply Chain Management", "Quality Control", "Quality Assurance", "Production Planning", "Time and Motion Study", "Acumatica ERP", "Microsoft Excel", "AutoCAD"];   // e.g. ["Process Mapping", "Lean", "Excel"]
const certs = [
  { role: "Basic Occupational Safety and Health (BOSH) Training, SO2", org: "40 hours", period: "July 2026", points: [] }
];

function renderTabs() {
  const tl = arr => `<div class="tl">${arr.map(i => `<article class="tli"><div class="th"><div><h3>${esc(i.role)}</h3>${i.org ? `<div class="org">${esc(i.org)}</div>` : ''}</div>${i.period ? `<span class="per">${esc(i.period)}</span>` : ''}</div>${(i.points || []).length ? `<ul>${i.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}</article>`).join('')}</div>`;
  $('#tp-experience').innerHTML = tl(experience) + (education.length ? `<h3 class="sub">Education</h3>` + tl(education) : '');
  $('#tp-certs').innerHTML = tl(certs);
  $('#tp-education').innerHTML = tl(education);
  $('#tp-skills').innerHTML = `<div class="skills">${skills.map(s => `<span>${esc(s)}</span>`).join('')}</div>`;
  const tabs = [['projects', 'Projects', 1], ['experience', 'Experience', experience.length], ['certs', 'Certifications', certs.length], ['skills', 'Skills', skills.length]].filter(t => t[2]);
  $('#tabs').innerHTML = tabs.map(t => `<button class="tab" type="button" role="tab" data-tab="${t[0]}">${t[1]}</button>`).join('');
  showTab('projects');
}
function showTab(id) {
  document.querySelectorAll('.tp').forEach(p => { p.hidden = p.id !== 'tp-' + id; });
  document.querySelectorAll('.tab').forEach(t => { const on = t.dataset.tab === id; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });

render(); renderTabs(); syncTheme();
/* Robot: head and eyes follow the cursor or finger; head nods while scrolling */
(function () {
  const bot = $('#bot'), head = $('#botHead'), pupils = [...document.querySelectorAll('.pupil')];
  if (!bot || !head) return;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let tx = innerWidth * 0.3, ty = innerHeight * 0.4, cx = tx, cy = ty, lastY = scrollY, nod = 0;
  const aim = (x, y) => { tx = x; ty = y; };
  addEventListener('pointermove', e => aim(e.clientX, e.clientY), { passive: true });
  const touch = e => { const t = e.touches && e.touches[0]; if (t) aim(t.clientX, t.clientY); };
  addEventListener('touchstart', touch, { passive: true });
  addEventListener('touchmove', touch, { passive: true });
  addEventListener('scroll', () => { nod = clamp((scrollY - lastY) * 0.5, -12, 12); lastY = scrollY; }, { passive: true });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (function loop() {
    cx += (tx - cx) * 0.14; cy += (ty - cy) * 0.14; nod *= 0.9;
    const r = bot.getBoundingClientRect(), hx = r.left + r.width / 2, hy = r.top + r.height * 0.32;
    const dx = cx - hx, dy = cy - hy, d = Math.hypot(dx, dy) || 1;
    const rot = clamp(Math.atan2(dx, Math.abs(dy) + 140) * 70, -26, 26);
    head.style.transform = `rotate(${rot}deg) translate(${clamp(dx / d * 3, -3, 3)}px, ${clamp(dy / d * 2.5 + nod * 0.35, -5, 5)}px)`;
    pupils.forEach(p => p.setAttribute('transform', `translate(${(dx / d * 3.4).toFixed(2)} ${(dy / d * 3.4 + nod * 0.15).toFixed(2)})`));
    requestAnimationFrame(loop);
  })();
})();
